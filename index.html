<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wick">
<meta name="theme-color" content="#140a2a">
<meta name="description" content="WICK: a candle-cat platformer. Your wax is your health, your height and your light. Reach the next torch before you burn down.">
<title>WICK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23200f38'/%3E%3Crect x='22' y='26' width='20' height='28' rx='5' fill='%23f6e6c4' stroke='%231c0d2a' stroke-width='3'/%3E%3Cpath d='M32 6c6 8 8 12 4 18-1 2-7 2-8 0-4-6-2-10 4-18z' fill='%23ffae34'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; height: 100dvh; width: 100%;
    background: #0c0618; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* the canvas is centred inside the safe area, clear of the notch and home bar */
  body {
    display: flex; align-items: center; justify-content: center; position: fixed; inset: 0;
    box-sizing: border-box;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #game {
    display: block; background: #140a2a;
    touch-action: none; -webkit-user-select: none; -webkit-touch-callout: none; user-select: none;
    outline: none;
  }
  noscript { color: #fbe9c8; font: 16px sans-serif; }

  /* touch controls: translucent amber circles, safe-area aware.
     Size, opacity and handedness come from Options: --tc-s scales the buttons,
     --tc-op / --tc-op-down set their idle and pressed opacity, .swap mirrors the layout. */
  #touch {
    position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5;
    --tc-s: 1; --tc-op: 0.35; --tc-op-down: 0.7;
    --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --sb: env(safe-area-inset-bottom, 0px);
  }
  #touch.on { display: block; }
  #touch.size-small { --tc-s: 0.8; }
  #touch.size-large { --tc-s: 1.25; }
  #touch.op-faint { --tc-op: 0.18; --tc-op-down: 0.5; }
  #touch.op-solid { --tc-op: 0.62; --tc-op-down: 0.88; }
  /* options preview: shown over the menu but never pressed */
  #touch.preview .tc, #touch.preview #tc-zone { pointer-events: none; }
  .tc {
    position: absolute; pointer-events: auto; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    display: flex; align-items: center; justify-content: center;
    color: #2a1630; font: 800 calc(15px * var(--tc-s)) "Trebuchet MS", Verdana, sans-serif; letter-spacing: 0.5px;
    box-sizing: border-box;
  }
  .tc.round, .tc .half {
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(255, 214, 140, 0.95), rgba(232, 128, 48, 0.85));
    border: 3px solid rgba(255, 236, 190, 0.9);
    box-shadow: 0 0 18px rgba(255, 150, 60, 0.6);
    opacity: var(--tc-op); transition: opacity 60ms;
  }
  .tc.down, .tc .half.down { opacity: var(--tc-op-down); }
  .tc.off { filter: grayscale(1) brightness(0.7); }
  /* floating thumb pad: touch anywhere in the lower left, the pad appears under the thumb */
  #tc-zone {
    position: absolute; pointer-events: auto; touch-action: none; left: 0; bottom: 0;
    width: 46%; height: 68%;
  }
  #tc-pad {
    position: absolute; pointer-events: none; width: 0; height: 0;
    left: calc(var(--sl) + 96px); bottom: calc(var(--sb) + 92px);
  }
  #tc-ring {
    position: absolute; left: -64px; top: -64px; width: 128px; height: 128px; border-radius: 50%;
    box-sizing: border-box; border: 3px solid rgba(255, 226, 170, 0.75);
    background: radial-gradient(circle, rgba(255, 170, 80, 0.10) 0%, rgba(255, 150, 60, 0.28) 70%, rgba(255, 190, 110, 0.4) 100%);
    box-shadow: 0 0 22px rgba(255, 150, 60, 0.45), inset 0 0 18px rgba(255, 150, 60, 0.35);
    opacity: var(--tc-op); transition: opacity 80ms;
  }
  #tc-knob {
    position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #fff2c8, #ffb24a 55%, #d8682a);
    border: 3px solid rgba(255, 240, 200, 0.95); box-shadow: 0 0 16px rgba(255, 160, 70, 0.8);
    opacity: calc(var(--tc-op) + 0.15); transition: transform 90ms ease-out, opacity 80ms;
  }
  #tc-pad.down #tc-ring { opacity: calc(var(--tc-op-down) + 0.05); }
  #tc-pad.down #tc-knob { opacity: 0.9; transition: opacity 80ms; }
  #tc-pad .arrow { position: absolute; top: -11px; font-size: 18px; color: rgba(255, 230, 180, 0.6); }
  #tc-pad .arrow.l { left: -56px; } #tc-pad .arrow.r { left: 40px; }
  #tc-jump { width: calc(100px * var(--tc-s)); height: calc(100px * var(--tc-s)); right: calc(var(--sr) + 18px); bottom: calc(var(--sb) + 18px); font-size: calc(17px * var(--tc-s)); }
  #tc-drip { width: calc(84px * var(--tc-s)); height: calc(84px * var(--tc-s)); right: calc(var(--sr) + 18px + 112px * var(--tc-s)); bottom: calc(var(--sb) + 18px + 8px * var(--tc-s)); }
  #tc-absorb { width: calc(66px * var(--tc-s)); height: calc(66px * var(--tc-s)); right: calc(var(--sr) + 18px + 18px * var(--tc-s)); bottom: calc(var(--sb) + 18px + 114px * var(--tc-s)); font-size: calc(12px * var(--tc-s)); }
  #tc-pause { width: 50px; height: 50px; right: calc(var(--sr) + 14px); top: calc(env(safe-area-inset-top, 0px) + 12px); font-size: 14px; }
  /* left-handed: buttons bottom-left, thumb pad bottom-right (pause stays top-right) */
  #touch.swap #tc-zone { left: auto; right: 0; }
  #touch.swap #tc-pad { left: auto; right: calc(var(--sr) + 96px); }
  #touch.swap #tc-jump { right: auto; left: calc(var(--sl) + 18px); }
  #touch.swap #tc-drip { right: auto; left: calc(var(--sl) + 18px + 112px * var(--tc-s)); }
  #touch.swap #tc-absorb { right: auto; left: calc(var(--sl) + 18px + 18px * var(--tc-s)); }

  #rotate {
    position: fixed; inset: 0; z-index: 10; display: none;
    background: #140a2a; color: #fbe9c8;
    font: 700 20px Georgia, "Times New Roman", serif;
    align-items: center; justify-content: center; flex-direction: column; text-align: center; gap: 18px;
  }
  #rotate.on { display: flex; }
  #boot {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; background: #140a2a; color: #fbe9c8;
    font: 700 18px Georgia, "Times New Roman", serif;
  }
  #boot.hide { display: none; }
  #boot small { display: block; margin-top: 12px; font: 400 14px Verdana, sans-serif; color: #ffb090; }
  #rotate .phone {
    width: 46px; height: 78px; border: 4px solid #ffb040; border-radius: 10px;
    animation: turn 2s ease-in-out infinite;
  }
  @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
</style>
</head>
<body>
<canvas id="game" width="960" height="540" aria-label="WICK game"></canvas>
<div id="rotate"><div class="phone"></div><div>Rotate your phone<br><small style="font-weight:400;font-size:15px">Wick plays sideways.</small></div></div>
<noscript>WICK needs JavaScript to run.</noscript>
<div id="boot">Lighting the wick...</div>
<script>
  // Show load failures on screen instead of a blank page (old iOS, blocked scripts, runtime errors).
  (function () {
    var shown = false;
    function show(msg) {
      if (shown) return; shown = true;
      var el = document.getElementById('boot');
      el.className = 'on err';
      el.innerHTML = 'WICK could not start on this browser.<br><small></small>';
      el.querySelector('small').textContent = msg;
    }
    window.addEventListener('error', function (e) { show(e.message || 'Script error'); });
    window.addEventListener('unhandledrejection', function (e) { show(String(e.reason)); });
    setTimeout(function () { if (!window.WICK) show('The game scripts did not load. iOS 14 or newer is required.'); }, 8000);
  })();
</script>
<script src="intro/hallucinated-intro.js"></script>
<script type="module" src="src/main.js"></script>
<script nomodule>document.getElementById('boot').innerHTML = 'WICK needs a newer browser (iOS 14 or later).';</script>
</body>
</html>
